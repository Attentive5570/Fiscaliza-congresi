name: Actualizar votaciones

on:
  schedule:
    - cron: "0 13-23 * * 2,4"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Máximo de sesiones a consultar en esta corrida"
        default: "25"

permissions:
  contents: write

concurrency:
  group: actualizar-votaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diputados y bloques
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
        run: python recolector.py --diputados -d datos

      - name: Votaciones nuevas
        run: |
          python recolector.py \
            --actualizar https://www.congreso.gob.gt/seccion_informacion_legislativa/votaciones_pleno \
            --desde 2024-01-14 \
            --max "${{ github.event.inputs.max || '25' }}" \
            -d datos

      - name: Unir votos y bancadas
        run: python recolector.py --consolidar -d datos

      - name: Guardar cambios
        run: |
          git config user.name "recolector-bot"
          git config user.email "recolector-bot@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
